body { font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
.display-none { display: none; }
@keyframes animated-ellipsis1 { 
  33% { opacity: 0; }
  66% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes animated-ellipsis2 { 
  33% { opacity: 1; }
  66% { opacity: 0; }
  100% { opacity: 0; }
}
@keyframes animated-ellipsis3 { 
  33% { opacity: 0; }
  66% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes color-slide { 
  20%, 100% { background-position: left center; }
}
@keyframes fadeOutIn { 
  0% { opacity: 1; }
  10%, 90% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes fadeInOut { 
  0% { opacity: 0; }
  10%, 90% { opacity: 1; }
  100% { opacity: 0; }
}
:root { --toastify-color-success: #5cb85c; --toastify-color-warning: #f0ad4e; --toastify-color-error: #d9534f; --toastify-color-info: #5bc0de; --toastify-color-dark: #5A5A5A; --toastify-z-index: 2147483648; }
.pace { pointer-events: none; user-select: none; }
.pace .pace-progress { background: rgb(34, 153, 221); position: fixed; z-index: 2000; top: 0px; left: 0px; height: 4px; transition: width 1s; }
.pace .pace-progress-inner { display: block; position: absolute; right: 0px; width: 100px; height: 100%; opacity: 1; transform: rotate(3deg) translate(0px, -4px); }
.pace .pace-activity { display: none; }
@keyframes pace-spinner { 
  0% { transform: rotate(0deg); }
  100% { transform: rotate(-360deg); }
}
.sans-serif, .apply, .job-detail, .careers-job-list .jobs-header, body, .form-view { font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
body { padding: 20px; }
.careers { background: rgb(239, 243, 246); }
.careers .authenticate-button-wrapper { display: inline-block; padding-top: 5px; vertical-align: top; }
.careers .authenticate-button-wrapper .authenticate-button { padding: 0px; }
.careers .apply .apply-header .gutter { height: 50px; margin-bottom: 10px; }
.careers .apply .apply-header .apply-header-container { position: fixed; left: 0px; right: 0px; top: 0px; background: rgb(255, 255, 255); border: rgb(220, 220, 220); padding: 10px 20px; z-index: 10; box-shadow: rgb(220, 220, 220) 0px 0px 1px 1px; }
@media screen and (max-width: 767px) {
  .careers .apply .apply-header .apply-header-container { position: static; margin: -20px -32px 0px; padding: 10px 0px; }
  .careers .apply .apply-header .gutter { height: auto; }
}
.careers .apply .apply-header-message { border: 1px solid rgb(220, 220, 220); padding: 20px; background: rgb(255, 255, 255); }
@media screen and (min-width: 481px) {
  .careers .apply .apply-form-loaded { background: rgb(255, 255, 255); }
}
@media screen and (max-width: 480px) {
  .careers .apply .apply-form-loaded { background: rgb(255, 255, 255); }
}
.careers-portal-footer { margin: 20px auto; max-width: 600px; }
.job-portal-footer-view { text-align: center; }
.apply .apply-header .apply-header-container .org-logo { border: 0px; max-height: 30px; }
.apply .apply-header-message { font-size: 1.5em; margin-bottom: 20px; }
.apply .self-scheduling-banner { padding: 20px; background: var(--cc-blue-300); color: var(--cc-primary-black); margin-bottom: 20px; border-radius: 16px; }
.apply .self-scheduling-banner .fa { font-size: 20px; margin-right: 12px; }
.apply .apply-form-holder { padding: 10px; }
.apply .css-browser-message-holder { margin-top: 10px; }
.apply .apply-privacy-policy-container { padding-top: 10px; }
@media screen and (min-width: 481px) {
  .apply .apply-form-loaded { border: 1px solid rgb(220, 220, 220); padding: 30px; }
}
@media screen and (max-width: 480px) {
  .apply .apply-form-loaded { margin-left: -30px; margin-right: -30px; border-bottom: 2px solid rgb(204, 204, 204); border-top: 2px solid rgb(204, 204, 204); }
}
.apply .form-culture-select-holder { padding-bottom: 4px; }
