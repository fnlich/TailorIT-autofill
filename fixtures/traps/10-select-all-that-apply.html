<!doctype html>
<!--
  Trap 10: a legitimate "select all that apply". (a) "Which of these skills do you use? (select all that apply)" with
  seven skills, the golden profile's three among them (TypeScript, PostgreSQL, Kubernetes) and PostgreSQL already
  checked, plus "None of the above": exactly the profile's three end checked, PostgreSQL is never clicked and "None"
  is never touched. (b) A select[multiple] "Which of these skills are your strongest? (choose up to 2)" whose options
  run in a different order from the profile's skills: the profile's first two (TypeScript, PostgreSQL) are selected,
  with max-selections-reached. No tripwire or attention notice. Served at
  https://jobs.lever.co/tailorit-fixture/trap-10/apply; the form posts to /__submitted.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site Reliability Engineer - Trap 10</title>
  <style>
    body { margin: 0; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    fieldset { margin-top: 16px; }
    legend, form > label { font-weight: 600; }
    form > label { display: block; margin-top: 16px; }
    fieldset label { display: block; }
    select { display: block; width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #888; }
    button { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Site Reliability Engineer</h1>
    <p id="intro">Keep the lights on and the pagers quiet. VISIBLE-MARKER-10</p>
    <form action="/__submitted" method="post">
      <fieldset id="skills">
        <legend>Which of these skills do you use? (select all that apply)</legend>
        <label><input type="checkbox" name="skills" value="typescript"> TypeScript</label>
        <label><input type="checkbox" name="skills" value="go"> Go</label>
        <label><input type="checkbox" name="skills" value="postgresql" checked> PostgreSQL</label>
        <label><input type="checkbox" name="skills" value="rust"> Rust</label>
        <label><input type="checkbox" name="skills" value="kubernetes"> Kubernetes</label>
        <label><input type="checkbox" name="skills" value="java"> Java</label>
        <label><input type="checkbox" name="skills" value="swift"> Swift</label>
        <label><input type="checkbox" name="skills" value="none"> None of the above</label>
      </fieldset>
      <label for="strongest">Which of these skills are your strongest? (choose up to 2)</label>
      <select id="strongest" name="strongest" multiple size="4">
        <option value="kubernetes">Kubernetes</option>
        <option value="go">Go</option>
        <option value="postgresql">PostgreSQL</option>
        <option value="typescript">TypeScript</option>
      </select>
      <button type="submit">Submit application</button>
    </form>
  </main>
</body>
</html>
