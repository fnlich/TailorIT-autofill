<!doctype html>
<!--
  Trap 09: hidden file inputs. (a) A screen-reader-only <input type=file accept=".pdf"> behind a visible
  <label for> "Attach resume": it qualifies through its label and gets the resume; the page's change listener writes
  the file name into #resume-name. (b) A visible "Attach" button that clicks a hidden file input with no label tie:
  flagged upload-control-not-recognized, never written. (c) A hidden file input with no control at all, marked
  data-honeypot: no row, no event. (d) A visible "Attach" button and its hidden input that the test-only adapter
  declares as an upload widget (with the "Resume" text as its label): it gets the resume. Served at
  https://jobs.lever.co/tailorit-fixture/trap-09/apply; the form posts to /__submitted.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mobile Engineer - Trap 09</title>
  <style>
    body { margin: 0; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .field { margin-top: 12px; }
    .field > label, .field > .caption { display: block; font-weight: 600; }
    input[type="text"], input[type="email"], input:not([type]) { display: block; width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #888; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    button { margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Mobile Engineer</h1>
    <p id="intro">Ship our iOS and Android apps. VISIBLE-MARKER-09</p>
    <form action="/__submitted" method="post">
      <div class="field">
        <label for="first">First name</label>
        <input id="first" name="first">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email">
      </div>
      <div class="field" id="field-a">
        <label for="resume">Attach resume</label>
        <input type="file" id="resume" name="resume" accept=".pdf" class="sr-only">
        <span id="resume-name"></span>
      </div>
      <div class="field" id="field-b">
        <button type="button" id="attach-b">Attach</button>
        <input type="file" id="file-b" name="portfolio_file" style="display: none">
      </div>
      <div class="field" id="field-c">
        <input type="file" id="file-c" name="extra_file" data-honeypot style="display: none">
      </div>
      <div class="field" id="field-d">
        <span class="caption" id="label-d">Resume</span>
        <button type="button" id="attach-d">Attach</button>
        <input type="file" id="file-d" name="document_d" style="display: none">
      </div>
      <button type="submit">Submit application</button>
    </form>
  </main>
  <script>
    window.__resumeChanges = 0;
    document.getElementById('resume').addEventListener('change', (event) => {
      window.__resumeChanges += 1;
      const file = event.target.files[0];
      document.getElementById('resume-name').textContent = file ? file.name : '';
    });
    document.getElementById('attach-b').addEventListener('click', () => document.getElementById('file-b').click());
    document.getElementById('attach-d').addEventListener('click', () => document.getElementById('file-d').click());
  </script>
</body>
</html>
