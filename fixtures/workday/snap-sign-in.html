    <meta name="description" property="og:description" content="Snap Inc is a technology company. We believe the camera presents the greatest opportunity to improve the way people live and communicate. Snap contributes to human progress by empowering people to express themselves, live in the moment, learn about the world, and have fun together. The Company operates Snapchat, a visual messaging app that enhances your relationships with friends, family, and the world, and Specs Inc., a wholly-owned subsidiary dedicated to making computing more human, in addition to Bitmoji, Saturn, and other digital services. We are looking for a talented and experienced business and data analyst to join the Ad Product Quality team at Snap. As an Ad Product Quality Analyst, you will be responsible for growing Snapchat’s advertising business by solving tough customer challenges and identifying opportunities to improve the quality of our monetization product offerings. What you'll do: Troubleshoot Snap’s web-based advertising platform and mobile app to reproduce and root-cause client-impacting issues and expedite bug fixes Leverage technical skills and product expertise to triage, investigate, and resolve technical issues preventing Snap’s customers from succeeding on our ads platform as quickly and efficiently as possible Organize training sessions that enable our frontline support teams to assist customers encountering challenges on the platform Maintain a backlog of software bugs and product improvements, and serve as a customer advocate as you prioritize the most impactful open issues with Product and Engineering teams Partner with our Product Marketing, Sales, and Support teams to collect customer feedback and identify opportunities to improve our products Derive quantitative and qualitative insights into ads products usage, systems stability, and the customer experience. Produce trend analyses of common customer pain points coupled with actionable recommendations for addressing them Perform pre-release QA and UAT to ensure product releases and updates work as intended and do not disrupt the customer experience Knowledge, Skills &amp;amp; Abilities: Ad-platform troubleshooting and quality Customer-impact analysis and prioritization Cross-functional execution and communication Minimum qualifications Bachelor’s Degree in STEM or related areas of study or equivalent industry experience 1+ years work experience in digital advertising, operations, or a related field Preferred qualifications: Experience troubleshooting front- and back-end web applications Experience sizing the impact of client-facing issues and setting priority Experience working with large data sets using SQL, Python, and other tools, and producing practical business insights via data visualization software (Looker, Tableau, etc.) Excellent verbal and written communication skills with high attention to detail Project management skills, identifying problems areas, designing solutions, and driving them to completion Experience with agile product development lifecycle using Jira or similar software Proficient in use of G Suite software (Gmail, Google Docs, Google Sheets, etc.) &quot;Default Together&quot; Policy at Snap: At Snap Inc. we believe that being together in person helps us build our culture faster, reinforce our values, and serve our community, customers and partners better through dynamic collaboration. To reflect this, we practice a “default together” approach and expect our team members to work in an office 4+ days per week. At Snap, we believe that having a team of diverse backgrounds and voices working together will enable us to create innovative products that improve the way people live and communicate. Snap is proud to be an equal opportunity employer, and committed to providing employment opportunities regardless of race, religious creed, color, national origin, ancestry, physical disability, mental disability, medical condition, genetic information, marital status, sex, gender, gender identity, gender expression, pregnancy, childbirth and breastfeeding, age, sexual orientation, military or veteran status, or any other protected classification, in accordance with applicable federal, state, and local laws. EOE, including disability/vets. We are an Equal Opportunity Employer and will consider qualified applicants with criminal histories in a manner consistent with applicable law (by example, the requirements of the San Francisco Fair Chance Ordinance and the Los Angeles Fair Chance Initiative for Hiring, where applicable). Our Benefits: Snap Inc. is its own community, so we’ve got your back! We do our best to make sure you and your loved ones have everything you need to be happy and healthy, on your own terms. Our benefits are built around your needs and include paid parental leave, comprehensive medical coverage, emotional and mental health support programs, and compensation packages that let you share in Snap’s long-term success! Compensation In the United States, work locations are assigned a pay zone which determines the salary range for the position. The successful candidate’s starting pay will be determined based on job-related skills, experience, qualifications, work location, and market conditions. The starting pay may be negotiable within the salary range for the position. These pay zones may be modified in the future. Zone A (CA, WA, NYC): The base hourly range for this position is $35.09-$52.4 hourly. Zone B: The base hourly range for this position is $33.17-$50 hourly. Zone C: The base hourly range for this position is $29.8-$44.71 hourly. This position is eligible for equity in the form of RSUs. If you believe this job description is missing required pay transparency information, please submit a report through this form: Job Description Pay Range Disclosure. Curious what it's like to work at Snap? Meet the people behind our products and discover how our values shape the way we create, innovate, and connect. SPECS: See how Snap is bringing computing into the world around us with SPECS, our next-generation augmented reality glasses built for real life. Snap News: Explore the latest stories about our products, innovation, and the people shaping what's next at Snap. Applicant and Candidate Privacy Policy">
