<!doctype html>
<!--
  Synthetic: a long application of sixty fields (v5 Phase 2, the streamed AI answers and the per-write scan check): 24
  the golden profile fills (names, contact, links, education, work, preferences) and 36 questions no rule knows, every
  one answered by TailorIT's answer route (twelve "How many years have you used <tool>?" boxes, twelve yes/no lists
  "Have you shipped a project with <tool> in production?", and twelve open questions). It has no script. Served at
  https://jobs.lever.co/tailorit-fixture/sixty-fields/apply. The form posts to /__submitted.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Platform Engineer - Sixty fields</title>
  <style>
    body { margin: 0; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select { display: block; width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #888; }
    button { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Platform Engineer</h1>
    <p>Build and run the platform our product teams ship on. VISIBLE-MARKER-SIXTY</p>
    <form action="/__submitted" method="post">

      <label for="preferred">Preferred name</label>
      <input id="preferred" name="preferred" type="text">
      <label for="email">Email</label>

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel">
      <label for="address1">Address line 1</label>
      <input id="address1" name="address1" type="text">
      <label for="city">City</label>
      <input id="city" name="city" type="text">
      <label for="state">State</label>

      <label for="school">School</label>
