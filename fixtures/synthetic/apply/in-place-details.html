<!doctype html>
<!-- TailorIT synthetic fixture (jr6 apply F2, APPLYPLAN §5 F2 tests): a job's details page that draws its guest
     application in place, at the same address, after its Apply (the shape of ADP Workforce Now's Current Openings:
     the audit apply-b.md B2 and B4, element ids and button words only; nothing of a capture). The job's two Apply
     buttons; a cookie preference centre's own "Apply", hidden, that is never the job's; a search box; and, in a
     template, the guest container a test draws in place. Every name and word here is made up. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Current Openings - Synthetic Careers</title>
  <style>
    body { font: 14px/1.4 sans-serif; margin: 0; }
    header, main { padding: 12px 16px; }
    button { padding: 8px 14px; }
    .job-description-apply-item { margin: 12px 0; }
    .guest-login-container label { display: block; margin-top: 8px; }
    .guest-login-container input { width: 260px; padding: 4px; }
  </style>
</head>
<body>
  <header>
    <label for="search">Search jobs</label>
    <input id="search" type="search" placeholder="Job title or keyword">
  </header>
  <main>
    <div class="job-description-main-container" name="jobDescriptionView">
      <h1>Platform Engineer</h1>
      <div class="job-description-data">
        <p>We build the platform our teams ship on. You will design services, keep them reliable and help others use
          them well.</p>
      </div>
      <div class="job-description-apply-item">
        <button id="recruitment_jobDescription_apply" type="button">Apply</button>
      </div>
      <div class="job-description-bottom-bar">
        <button id="recruitment_jobDescription_back" type="button">Back</button>
        <button id="recruitment_jobDescription_candidateApply" type="button">Apply</button>
      </div>
    </div>
    <div id="guest-slot"></div>
  </main>
  <section id="ot-fltr-modal" style="display: none">
    <button id="filter-apply-handler" type="button">Apply</button>
  </section>
  <template id="guest-template">
    <div class="guest-login-container">
      <div class="banner">Tell us about yourself.</div>
      <label for="guestFirstName">First Name</label>
      <input id="guestFirstName" type="text" autocomplete="given-name">
      <label for="guestLastName">Last Name</label>
      <input id="guestLastName" type="text" autocomplete="family-name">
      <label for="guestEmail">Email</label>
      <input id="guestEmail" type="email" autocomplete="email">
    </div>
  </template>
</body>
</html>
