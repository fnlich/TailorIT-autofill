<!doctype html>
<!--
  Synthetic (the v3 Phase 4 review): greenhouse.html's form (the same questions, ?badge and ?resume), whose Submit opens
  Greenhouse's confirmation as a page of its own: on its form's submit event it posts nothing, counts the submission on
  the body (data-submitted) and goes to <posting>/confirmation (location.assign), which the spec serves with
  greenhouse-confirmation.html. Served at https://job-boards.greenhouse.io/tailoritfixture/jobs/<id>. It dispatches no
  event, and clicks, focuses or submits nothing itself.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Application for Senior Backend Engineer at Northwind</title>
  <style>
    body { margin: 0; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #888; }
    .application--submit button { margin-top: 20px; padding: 10px 20px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); border: 0; }
  </style>
</head>
<body data-submitted="0">
  <main class="main">
    <h1>Senior Backend Engineer</h1>
    <form id="application-form" class="application--form">
      <div class="field-wrapper"><label for="first_name">First Name<span aria-hidden="true">*</span></label>
        <input id="first_name" name="first_name" type="text" aria-required="true"></div>
      <div class="field-wrapper"><label for="last_name">Last Name<span aria-hidden="true">*</span></label>
        <input id="last_name" name="last_name" type="text" aria-required="true"></div>
      <div class="field-wrapper"><label for="email">Email<span aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" aria-required="true"></div>
      <div class="field-wrapper" id="badge-question"><label for="badge">Badge number<span aria-hidden="true">*</span></label>
        <input id="badge" name="badge" type="text" aria-required="true"></div>
      <div class="field-wrapper" id="resume-question"><label for="resume">Resume/CV<span aria-hidden="true">*</span></label>
        <input id="resume" name="resume" type="file" aria-required="true" class="visually-hidden"></div>
      <div class="field-wrapper"><label for="website">Website</label>
        <input id="website" name="website" type="text"></div>
      <div class="application--submit"><button class="btn btn--pill" type="submit">Submit application</button></div>
    </form>
  </main>
  <script>
    (() => {
      if (!location.search.includes('badge')) document.getElementById('badge-question').remove();
      if (!location.search.includes('resume')) document.getElementById('resume-question').remove();
      const form = document.getElementById('application-form');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        document.body.dataset.submitted = String(Number(document.body.dataset.submitted) + 1);
        location.assign(`${location.pathname}/confirmation`);
      });
    })();
  </script>
</body>
</html>
