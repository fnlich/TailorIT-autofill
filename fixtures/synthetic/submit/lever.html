<!doctype html>
<!--
  Synthetic (v3 Phase 4): a Lever application form, as its adapter reads one (form#application-form holding
  li.application-question items, its Submit button#btn-submit, typeless type="button" as Lever's is), with the questions
  the golden profile answers. Served at https://jobs.lever.co/tailorit-fixture/<posting>/apply. The page's own script
  stands for Lever's: a click on its Submit opens the page after submitting, <posting>/thanks (location.assign), as
  Lever's does; it posts nothing. It dispatches no event, and clicks, focuses or submits nothing itself.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind - Senior Backend Engineer</title>
  <style>
    body { margin: 0; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    ul { list-style: none; padding: 0; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #888; }
    #btn-submit { margin-top: 20px; padding: 10px 20px; }
  </style>
</head>
<body>
  <main>
    <h1>Senior Backend Engineer</h1>
    <form id="application-form">
      <ul>
        <li class="application-question"><label>Full name<input name="name" type="text"></label></li>
        <li class="application-question"><label>Email<input name="email" type="email"></label></li>
        <li class="application-question"><label>Phone<input name="phone" type="tel"></label></li>
      </ul>
      <button id="btn-submit" type="button" data-qa="btn-submit">Submit application</button>
    </form>
  </main>
  <script>
    (() => {
      document.getElementById('btn-submit').addEventListener('click', () => {
        location.assign(location.href.split('?')[0].replace(/apply$/, 'thanks'));
      });
    })();
  </script>
</body>
</html>
