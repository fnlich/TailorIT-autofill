<!doctype html>
<!--
  Synthetic: Workable's application page (app.ts says exactly what it does, from the Workable capture of 2026-11-02),
  built by Vite in memory by its e2e spec (e2e/helpers/workable-fixture.ts) and served at Workable addresses, where the
  Workable adapter handles it: https://apply.workable.com/tailorit-fixture/j/0000000A01/apply/ draws its form 1.5 s
  after it loads (the live page draws it 4.6 to 7.5 s after), .../j/0000000A02/apply/ at once; each posting's address
  without /apply/ draws its overview instead (its description, requirements and benefits, 1.5 s after it loads), the
  0000000A04 posting's saying "Please do not use AI tools to apply." Nothing goes to any server: the page keeps its
  draft and what it saw in window.__workable (app.ts, WorkableLog). The DOM tests mount the same app into this page's
  div#wk-app.
  The styles are a few of Workable's own (the hidden radio and checkbox inputs at opacity 0, the 1 px file inputs and
  hidden value inputs, the country list hidden with .iti__hide) and plain ones.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Software Engineer - TailorIT Fixture</title>
  <style>
    body { margin: 0; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
    header, #wk-app { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    nav { display: flex; gap: 24px; border-bottom: 1px solid #ddd; margin-bottom: 16px; }
    nav a { color: #036; text-decoration: none; padding: 8px 0; }
    .wk-autofill { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    .wk-section { margin-top: 24px; }
    .wk-section-head { display: flex; justify-content: space-between; align-items: center; }
    .wk-field { margin-top: 16px; }
    .wk-label { display: block; }
    .wk-title-row { display: block; margin-bottom: 4px; }
    .wk-star { color: #c00; margin-right: 4px; }
    .wk-optional { color: #666; }
    input[type="text"], input[type="email"], input[type="tel"], textarea { box-sizing: border-box; width: 100%; padding: 8px;
      border: 1px solid #888; border-radius: 4px; font: inherit; }
    .wk-select { position: relative; }
    .wk-dialog { position: fixed; margin: 0; padding: 4px 0; z-index: 10;
      border: 1px solid #888; background: #fff; }
    .wk-dialog ul { list-style: none; margin: 0; padding: 0; }
    .wk-dialog li { padding: 6px 12px; }
    .wk-hidden-value { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); border: 0;
      padding: 0; margin: -1px; }
    .iti { position: relative; display: flex; gap: 8px; }
    .iti__selected-country { display: flex; gap: 4px; align-items: center; border: 1px solid #888; background: #fff;
      border-radius: 4px; padding: 0 8px; font: inherit; }
    .iti__country-selector { position: absolute; top: 100%; left: 0; z-index: 10; background: #fff; border: 1px solid #888; }
    .iti__country-selector ul { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow-y: auto; }
    .iti__country-selector li { padding: 4px 10px; }
    .iti__hide { display: none; }
    fieldset { border: 0; padding: 0; margin: 0; }
    .wk-yesno { display: flex; gap: 8px; }
    .wk-option { width: 60px; height: 32px; border: 1px solid #555; border-radius: 4px; display: flex; align-items: center;
      justify-content: center; position: relative; }
    .wk-option.wk-on { background: #2b6; color: #fff; }
    .wk-option label { display: flex; align-items: center; gap: 4px; }
    .wk-option input, .wk-box input { position: absolute; opacity: 0; width: 14px; height: 14px; margin: 0; }
    .wk-choice { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
    .wk-box { position: relative; width: 16px; height: 16px; border: 1px solid #555; border-radius: 3px; flex: none; }
    .wk-box.wk-round { border-radius: 8px; }
    [aria-checked="true"].wk-box { background: #2b6; }
    .wk-dropzone { display: flex; gap: 12px; align-items: center; border: 1px dashed #888; padding: 12px; }
    .wk-icon { display: inline-block; width: 24px; height: 24px; }
    .wk-choose { color: #036; text-decoration: underline; cursor: pointer; }
    .wk-file { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; padding: 0;
      margin: -1px; }
    .react-datepicker-popper { border: 1px solid #888; padding: 8px; display: flex; gap: 8px; background: #fff; }
    .wk-submit { margin-top: 24px; width: 100%; padding: 10px; font: inherit; }
    .wk-cookies { position: fixed; left: 16px; bottom: 16px; background: #222; color: #fff; padding: 12px; display: flex;
      gap: 8px; z-index: 20; }
  </style>
</head>
<body data-submitted="0">
  <header>
    <h1>Software Engineer</h1>
    <nav role="navigation">
      <a data-ui="role-overview-tab" href="./">Overview</a>
      <a data-ui="application-form-tab" href="./apply/">Application</a>
    </nav>
  </header>
  <div id="wk-app"></div>
  <div data-ui="cookie-consent" role="dialog" aria-label="Cookie Consent" class="wk-cookies">
    <span>We use cookies.</span>
    <button data-ui="cookie-consent-accept" type="button">Accept all</button>
    <button data-ui="cookie-consent-decline" type="button">Decline all</button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
