<!doctype html>
<!--
  Synthetic: a Greenhouse-style section of questions (the Phase E review, M1). Greenhouse puts a form's questions in
  one section, a legal one among the rest: here "Application questions" holds the work-authorization radio (the golden
  profile answers yes), a question no rule knows ("Which of our offices would you visit first?") and a free-text one
  ("Why do you want to work here?"). The legal radio is the profile's and never reaches an AI request; it closes
  neither of the other two, so the first is answered by TailorIT's answer route and the second drafted. It has no
  script. Served at https://jobs.lever.co/tailorit-fixture/fill-all-section/apply. The form posts to /__submitted.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Solutions Engineer - One section of questions</title>
  <style>
    body { margin: 0; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    form > label { display: block; margin-top: 12px; font-weight: 600; }
    input:not([type="radio"]), textarea { display: block; width: 100%; box-sizing: border-box; padding: 6px;
      border: 1px solid #888; }
    textarea { height: 96px; }
    fieldset { margin-top: 16px; }
    legend { font-weight: 600; }
    fieldset label { display: block; }
    button { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Solutions Engineer</h1>
    <p>Work with our customers to design their integrations. VISIBLE-MARKER-SECTION</p>
    <form action="/__submitted" method="post">
      <label for="first">First name</label>
      <input id="first" name="first">
      <label for="email">Email</label>
      <input id="email" name="email" type="email">
      <h2>Application questions</h2>
      <fieldset id="authorized">
        <legend>Are you legally authorized to work in the United States?</legend>
        <label><input type="radio" name="authorized" value="yes"> Yes</label>
        <label><input type="radio" name="authorized" value="no"> No</label>
      </fieldset>
      <label for="office">Which of our offices would you visit first?</label>
      <input id="office" name="office">
      <label for="why">Why do you want to work here?</label>
      <textarea id="why" name="why"></textarea>
      <button type="submit">Submit application</button>
    </form>
  </main>
</body>
</html>
